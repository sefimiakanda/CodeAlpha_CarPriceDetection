[project]
name = "car-price"
version = "0.1.0"
description = "Prédiction du prix de vente de véhicules d'occasion (entraînement + API)"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5,<2",
    "joblib>=1.4",
]

# Outils de développement : tests + notebook (non installés dans Docker)
[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "jupyterlab>=4",
    "matplotlib>=3.8",
    "seaborn>=0.13",
]

[tool.uv]
package = false          # simple dossier de scripts : pas de package à construire

[tool.pytest.ini_options]
pythonpath = ["src"]     # permet `import api` et `import train` dans les tests
testpaths = ["tests"]
